[package]
name = "kai-vcs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Kai VCS preservation kernel (experimental)"

[workspace]
members = ["tools/reference-reader", "tools/fixtures"]
resolver = "3"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1.24"

[dev-dependencies]
cddl = { version = "=0.10.7", default-features = false, features = ["cbor", "json", "additional-controls", "ast-span", "ast-comments", "ast-parent"] }
ciborium = "=0.2.2"
kai-object-reference = { path = "tools/reference-reader" }
