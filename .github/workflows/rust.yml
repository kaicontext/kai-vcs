name: Rust conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.99.0 fmt --all -- --check
      - name: Static checks
        run: cargo +1.99.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Conformance and reference model
        run: cargo +1.99.0 test --workspace --locked
      - name: Independent JSON contract corpus
        run: |
          python tools/interface-reference/check.py
          python tools/interface-reference/profiles.py
          python tools/interface-reference/frontier.py
          python -m unittest discover -s tools/qualification -p "test_*.py"
      - name: Reproduce independent golden vectors
        shell: bash
        run: |
          cargo +1.99.0 run --locked -p kai-object-reference --example vectors > tests/fixtures/objects.tsv
          cargo +1.99.0 run --locked -p kai-object-reference --example vectors -- --signing-payloads > tests/fixtures/attestation-payloads.tsv
          git diff --exit-code -- tests/fixtures/objects.tsv tests/fixtures/attestation-payloads.tsv
      - name: Build process fault tools
        run: cargo +1.99.0 build --workspace --bins --locked
      - name: Generate acceptance fixtures
        run: cargo +1.99.0 run --locked -p kai-fixtures --bin kai-fixtures -- acceptance-fixtures
      - name: Process kill and restart qualification
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          python tools/qualification/faults.py --child "target/debug/kai-fault-child$suffix" --reader "target/debug/kai-bundle-reader$suffix" --bundle acceptance-fixtures/F03/state-a.kai-bundle --report fault-report.json
      - name: Preserve fixture and fault evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixture-fault-evidence-${{ matrix.os }}
          path: |
            acceptance-fixtures/manifest.json
            fault-report.json
